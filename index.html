<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riftbound Pool Tracker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0a14;--bg2:#111128;--bg3:#1a1a2e;
    --border:#1e1e3a;--border2:#2d2d4e;
    --text:#e2e8f0;--text2:#9ca3af;--text3:#6b7280;
    --purple:#c4b5fd;--purple2:#7c3aed;--purple3:#6d28d9;
    --blue:#60a5fa;--green:#34d399;--yellow:#fbbf24;--red:#f87171;
  }
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}
  .hdr{background:linear-gradient(135deg,#1a0533,#0d1a2e);border-bottom:1px solid #2d1f4e;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  .hdr-brand .title{font-size:18px;font-weight:800;color:var(--purple);letter-spacing:1px}
  .hdr-brand .sub{font-size:9px;color:#7c6fa0;letter-spacing:2px}
  .hdr-spacer{flex:1}
  .stat-pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{background:#ffffff08;border:1px solid #ffffff10;border-radius:8px;padding:5px 11px;text-align:center;min-width:58px}
  .pill .v{font-size:16px;font-weight:800}
  .pill .l{font-size:9px;color:var(--text3);letter-spacing:1px}
  .tab-group{display:flex;gap:4px}
  .tab-btn{background:#ffffff0a;border:1px solid #ffffff15;border-radius:6px;color:var(--text2);padding:5px 11px;cursor:pointer;font-size:11px;font-weight:600;transition:all .15s}
  .tab-btn.active{background:var(--purple3);border-color:var(--purple2);color:#fff}
  .main{padding:12px 16px;max-width:1100px;margin:0 auto}
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .filters input,.filters select{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:6px 9px;font-size:12px;outline:none}
  .filters input{flex:1;min-width:130px}
  .filters input:focus,.filters select:focus{border-color:var(--purple2)}
  .btn-add{background:var(--purple3);border:none;border-radius:8px;color:#fff;padding:6px 14px;cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap}
  .btn-add:hover{background:var(--purple2)}
  .btn-imp{background:transparent;border:1px solid #60a5fa44;border-radius:8px;color:var(--blue);padding:6px 10px;cursor:pointer;font-size:12px;white-space:nowrap}
  .btn-imp:hover{background:#60a5fa11}
  .count{font-size:11px;color:var(--text3);margin-bottom:6px}
  .card-row{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;transition:border-color .15s}
  .card-row:hover{border-color:var(--border2)}
  .rarity-icon{font-size:15px;flex-shrink:0;width:20px;text-align:center;filter:drop-shadow(0 0 4px currentColor)}
  .card-info{flex:1;min-width:100px}
  .card-name{font-weight:700;font-size:13px;color:#f1f5f9;margin-bottom:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .card-num-tag{font-size:10px;font-weight:500;color:var(--text3);font-family:monospace;background:#ffffff08;border:1px solid #ffffff12;border-radius:4px;padding:1px 5px}
  .badges{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
  .badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid}
  .note-txt{font-size:10px;color:var(--text3)}
  .prog-wrap{min-width:80px}
  .prog-counts{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
  .prog-bg{background:var(--border);border-radius:4px;height:5px;overflow:hidden}
  .prog-fill{height:100%;border-radius:4px;transition:width .2s}
  .prog-total{text-align:center;font-size:9px;color:var(--text3);margin-top:2px}
  .ctrl-wrap{display:flex;align-items:center;gap:4px}
  .ctrl-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:2px 8px;cursor:pointer;font-weight:700;font-size:14px;transition:all .1s}
  .ctrl-btn:disabled{opacity:.25;cursor:default}
  .ctrl-btn:not(:disabled):hover{border-color:var(--purple2)}
  .ctrl-val{font-size:12px;font-weight:700;color:var(--purple);min-width:30px;text-align:center}
  .chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid;min-width:60px;text-align:center;white-space:nowrap}
  .chip-pool{background:#064e3b22;color:var(--green);border-color:#34d39944}
  .chip-deck{background:#78350f22;color:var(--yellow);border-color:#fbbf2444}
  .chip-split{background:#1e1b4b;color:#818cf8;border-color:#818cf844}
  .act-wrap{display:flex;gap:3px}
  .act-btn{background:transparent;border:1px solid var(--border2);border-radius:6px;color:var(--text3);padding:3px 7px;cursor:pointer;font-size:12px;transition:all .15s}
  .act-btn:hover{color:var(--text)}
  .empty{text-align:center;color:var(--text3);padding:60px 20px}
  .empty .icon{font-size:40px;margin-bottom:10px}
  .empty .t1{font-size:14px;font-weight:600;margin-bottom:4px;color:var(--text2)}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .sc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px}
  .sc-title{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
  .sc-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
  .sc-row:last-child{border:none}
  .sc-bar{padding:4px 0}
  .sc-bar-lbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
  .sc-bar-bg{background:var(--border);border-radius:4px;height:5px}
  .sc-bar-fill{height:100%;border-radius:4px;transition:width .3s}
  .overlay{position:fixed;inset:0;background:#000000aa;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
  .modal h3{font-size:15px;font-weight:800;color:var(--purple);margin-bottom:14px}
  .field{margin-bottom:9px}
  .field label{display:block;font-size:10px;font-weight:600;color:var(--text3);margin-bottom:3px;letter-spacing:.5px;text-transform:uppercase}
  .field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:7px 9px;font-size:13px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--purple2)}
  .field input[readonly]{opacity:.5}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .autofill-banner{border-radius:8px;font-size:11px;padding:7px 10px;margin-bottom:10px;display:none;gap:6px;align-items:center}
  .autofill-ok{background:#0d2218;border:1px solid #34d39955;color:var(--green);}
  .autofill-err{background:#2a0d0d;border:1px solid #f8717155;color:var(--red);}
  .btn-save{width:100%;background:var(--purple3);border:none;border-radius:8px;color:#fff;padding:9px;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px}
  .btn-save:hover{background:var(--purple2)}
  .btn-cancel{width:100%;background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--text2);padding:9px;font-size:13px;cursor:pointer;margin-top:6px}
  .btn-cancel:hover{background:var(--bg3)}
  .imp-note{color:var(--text3);font-size:11px;margin-bottom:8px;line-height:1.5}
  code{background:#ffffff11;padding:1px 5px;border-radius:3px;font-size:11px}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
  .domain-checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .domain-chk{display:flex;align-items:center;gap:5px;cursor:pointer;padding:4px 8px;border-radius:6px;border:1px solid var(--border2);background:var(--bg);transition:all .15s;user-select:none;font-size:12px;font-weight:600}
  .domain-chk input[type=checkbox]{display:none}
  .domain-chk.checked{filter:brightness(1.2)}
  .domain-chk .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .domain-hint{font-size:10px;color:var(--text3);margin-top:4px}
  /* Autocomplete */
  .ac-wrap{position:relative}
  .ac-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--purple2);border-radius:8px;z-index:200;max-height:280px;overflow-y:auto;margin-top:2px;display:none;box-shadow:0 8px 24px #00000099}
  .ac-item{padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
  .ac-item:last-child{border:none}
  .ac-item:hover,.ac-item.ac-active{background:var(--purple3)}
  .ac-main{flex:1;min-width:0}
  .ac-name{font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ac-item:hover .ac-name,.ac-item.ac-active .ac-name{color:#fff}
  .ac-meta{font-size:10px;color:var(--text3);margin-top:2px}
  .ac-item:hover .ac-meta,.ac-item.ac-active .ac-meta{color:#ffffffbb}
  .ac-num{font-family:monospace;font-size:10px;color:var(--text3);white-space:nowrap;flex-shrink:0}
  .ac-item:hover .ac-num,.ac-item.ac-active .ac-num{color:#ffffffbb}
  .ac-tag{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;white-space:nowrap;flex-shrink:0}
  .ac-tag-pool{background:#34d39922;color:var(--green);border:1px solid #34d39944}
  .ac-tag-db{background:#60a5fa22;color:var(--blue);border:1px solid #60a5fa44}
  .ac-item:hover .ac-tag,.ac-item.ac-active .ac-tag{background:#ffffff22;color:#fff;border-color:#ffffff44}
  .ac-status{padding:10px;text-align:center;color:var(--text3);font-size:12px;font-style:italic}
  /* Lookup button */
  .lookup-row{display:flex;gap:6px}
  .lookup-row input{flex:1}
  .btn-lookup{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--blue);padding:7px 12px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;transition:all .15s;flex-shrink:0}
  .btn-lookup:hover{border-color:var(--blue);background:#60a5fa11}
  .btn-lookup:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-brand">
    <div class="title">⚔️ RIFTBOUND</div>
    <div class="sub">POOL TRACKER</div>
  </div>
  <div class="hdr-spacer"></div>
  <div class="stat-pills">
    <div class="pill"><div class="v" id="s-total">0</div><div class="l">TOTAL</div></div>
    <div class="pill"><div class="v" id="s-unique">0</div><div class="l">UNIQUE</div></div>
    <div class="pill"><div class="v" style="color:var(--yellow)" id="s-deck">0</div><div class="l">IN DECK</div></div>
    <div class="pill"><div class="v" style="color:var(--green)" id="s-pool">0</div><div class="l">IN POOL</div></div>
  </div>
  <div class="tab-group">
    <button class="tab-btn active" id="tab-list" onclick="setView('list')">📋 Cards</button>
    <button class="tab-btn" id="tab-stats" onclick="setView('stats')">📊 Stats</button>
  </div>
</div>

<div class="main">
  <div id="view-list">
    <div class="filters">
      <button class="btn-add" onclick="openAdd()">+ Add Card</button>
      <input id="f-search" placeholder="🔍 Search name or card no..." oninput="render()">
      <select id="f-set" onchange="render()">
        <option>All</option><option>Origins</option><option>Spiritforged</option><option>Proving Grounds</option><option>Other</option>
      </select>
      <select id="f-rarity" onchange="render()">
        <option>All</option><option>Common</option><option>Uncommon</option><option>Rare</option><option>Epic</option><option>Showcase</option>
      </select>
      <select id="f-domain" onchange="render()">
        <option>All</option><option>Fury</option><option>Calm</option><option>Mind</option><option>Body</option><option>Chaos</option><option>Order</option><option>None</option>
      </select>
      <select id="f-type" onchange="render()">
        <option value="All">All Types</option>
        <option>Legend</option><option>Champion Unit</option><option>Unit</option><option>Spell</option>
        <option>Gear</option><option>Equipment</option><option>Battlefield</option><option>Token</option>
        <option>Rune</option><option>Other</option>
      </select>
      <select id="f-status" onchange="render()">
        <option>All</option><option>In Deck</option><option>In Pool</option><option>Mixed</option>
      </select>
      <select id="f-sort" onchange="render()">
        <option value="name">Sort: Name</option>
        <option value="rarity">Sort: Rarity</option>
        <option value="type">Sort: Type</option>
        <option value="set">Sort: Set</option>
        <option value="num">Sort: Card No.</option>
        <option value="copies">Sort: Copies</option>
      </select>
      <button class="btn-imp" onclick="openImport()">📥 Import</button>
    </div>
    <div class="count" id="count-txt"></div>
    <div id="card-list"></div>
  </div>
  <div id="view-stats" style="display:none"></div>
</div>

<!-- Add/Edit Modal -->
<div class="overlay" id="modal-form" style="display:none" onclick="if(event.target===this)closeModal('modal-form')">
  <div class="modal">
    <h3 id="modal-title">Add Card</h3>

    <div id="autofill-banner" class="autofill-banner"></div>

    <!-- Name + lookup button -->
    <div class="field">
      <label>Card Name *</label>
      <div class="ac-wrap">
        <div class="lookup-row">
          <input id="m-name" placeholder="Type name then hit 🔍 Lookup..." autocomplete="off"
            oninput="acPoolInput()" onkeydown="acKey(event)" onkeypress="if(event.key==='Enter')lookupCard()">
          <button class="btn-lookup" id="btn-lookup" onclick="lookupCard()">🔍 Lookup</button>
        </div>
        <div class="ac-dropdown" id="ac-dropdown"></div>
      </div>
      <div style="font-size:10px;color:var(--text3);margin-top:4px">
        Type name → click 🔍 Lookup to auto-fill from database. Or pick from dropdown if already in your pool.
      </div>
    </div>

    <div class="field-grid">
      <div class="field"><label>Set</label>
        <select id="m-set"><option>Origins</option><option>Spiritforged</option><option>Proving Grounds</option><option>Other</option></select>
      </div>
      <div class="field"><label>Rarity</label>
        <select id="m-rarity"><option>Common</option><option>Uncommon</option><option>Rare</option><option>Epic</option><option>Showcase</option></select>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>Domain <span style="font-weight:400;text-transform:none;letter-spacing:0">(up to 2)</span></label>
        <div class="domain-checks" id="m-domain-checks"></div>
        <div class="domain-hint" id="m-domain-hint"></div>
      </div>
      <div class="field"><label>Card Type</label>
        <select id="m-type">
          <option>Legend</option><option>Champion Unit</option><option>Unit</option><option>Spell</option>
          <option>Gear</option><option>Equipment</option><option>Battlefield</option><option>Token</option>
          <option>Rune</option><option>Other</option>
        </select>
      </div>
      <div class="field"><label>Card Number</label>
        <input id="m-cardnum" placeholder="e.g. OGN-042" style="font-family:monospace" autocomplete="off">
      </div>
      <div class="field"><label>Total Copies</label><input id="m-total" type="number" min="1" value="1" oninput="syncPool()"></div>
      <div class="field"><label>Copies in Deck</label><input id="m-deck" type="number" min="0" value="0" oninput="syncPool()"></div>
      <div class="field" style="grid-column:1/-1"><label>Copies in Pool</label><input id="m-pool" type="number" readonly></div>
    </div>
    <div class="field"><label>Notes</label><input id="m-notes" placeholder="Optional..."></div>
    <button class="btn-save" onclick="saveCard()">Add to Pool</button>
    <button class="btn-cancel" onclick="closeModal('modal-form')">Cancel</button>
  </div>
</div>

<!-- Import Modal -->
<div class="overlay" id="modal-import" style="display:none" onclick="if(event.target===this)closeModal('modal-import')">
  <div class="modal">
    <h3>📥 Quick Import</h3>
    <p class="imp-note">One card per line. Tab-separated qty + name, or just name.<br>Example: <code>3	Fiora, Grand Duelist</code> or just <code>Riposte</code></p>
    <div class="field"><textarea id="imp-txt" rows="8" style="font-family:monospace;font-size:12px;resize:vertical" placeholder="3&#9;Fiora, Grand Duelist&#10;2&#9;Riposte&#10;1&#9;Void Gate"></textarea></div>
    <button class="btn-save" onclick="doImport()">Import Cards</button>
    <button class="btn-cancel" onclick="closeModal('modal-import')">Cancel</button>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────
const RARITIES = ["Common","Uncommon","Rare","Epic","Showcase"];
const TYPES    = ["Legend","Champion Unit","Unit","Spell","Gear","Equipment","Battlefield","Token","Rune","Other"];
const DOMAINS  = ["Fury","Calm","Mind","Body","Chaos","Order"];
const RC = {Common:"#9ca3af",Uncommon:"#34d399",Rare:"#60a5fa",Epic:"#a78bfa",Showcase:"#f59e0b"};
const RI = {Common:"●",Uncommon:"◆",Rare:"★",Epic:"✦",Showcase:"👁"};
const DC = {Fury:"#f87171",Calm:"#34d399",Mind:"#60a5fa",Body:"#fb923c",Chaos:"#a78bfa",Order:"#fbbf24",None:"#6b7280"};

// ── Map riftcodex schema → our labels ─────────────────────────
// classification.type + supertype → our type
function mapType(type, supertype) {
  const t = (type||"").toLowerCase();
  const s = (supertype||"").toLowerCase();
  if(t==="unit" && s==="champion") return "Champion Unit";
  if(t==="unit" && s==="legend")   return "Legend";
  if(t==="unit" && s==="token")    return "Token";
  if(t==="unit")   return "Unit";
  if(t==="spell")  return "Spell";
  if(t==="gear")   return "Gear";
  if(t==="equipment") return "Equipment";
  if(t==="battlefield") return "Battlefield";
  if(t==="rune")   return "Rune";
  return "Other";
}
// classification.rarity → our rarity
function mapRarity(r) {
  const s = (r||"").toLowerCase();
  if(s==="common")   return "Common";
  if(s==="uncommon") return "Uncommon";
  if(s==="rare")     return "Rare";
  if(s==="epic")     return "Epic";
  // overnumbered cards are Showcase rarity
  return "Showcase";
}
// set.set_id → our set label (riftcodex uses lowercase)
function mapSet(id) {
  const s = (id||"").toUpperCase();
  if(s==="OGN") return "Origins";
  if(s==="SFD") return "Spiritforged";
  if(s==="PGS") return "Proving Grounds";
  return "Other";
}
// classification.domain[] → our domains (already correct case from API)
function mapDomains(arr) {
  if(!Array.isArray(arr)) return [];
  const valid = new Set(DOMAINS);
  return arr.map(d => {
    const cap = d.charAt(0).toUpperCase()+d.slice(1).toLowerCase();
    return valid.has(cap) ? cap : null;
  }).filter(Boolean);
}
// collector_number + set_id → card number string e.g. "OGN-042"
function makeCardNum(setId, num) {
  if(!setId || !num) return "";
  return `${(setId||"").toUpperCase()}-${String(num).padStart(3,"0")}`;
}

// Parse a riftcodex card object into our internal format (partial — no copies/deck)
function parseApiCard(c) {
  const cl  = c.classification || {};
  const st  = c.set            || {};
  const ovr = c.metadata?.overnumbered || false;
  const sig = c.metadata?.signature    || false;
  // Showcase = overnumbered or signature
  const rarity = (ovr || sig) ? "Showcase" : mapRarity(cl.rarity);
  return {
    name:    c.name,
    cardNum: makeCardNum(st.set_id, c.collector_number),
    set:     st.label || mapSet(st.set_id),
    rarity,
    domains: mapDomains(cl.domain),
    type:    mapType(cl.type, cl.supertype),
  };
}

// ── State ─────────────────────────────────────────────────────
let cards=[], editId=null, currentView="list", acIndex=-1, acPoolItems=[];

// ── Persist ───────────────────────────────────────────────────
function load(){
  try{cards=migrate(JSON.parse(localStorage.getItem("rb-tracker")||"[]"));}catch(e){cards=[];}
  render();
}
function save(){localStorage.setItem("rb-tracker",JSON.stringify(cards));}
function migrate(arr){
  return arr.map(c=>{
    const o={...c};
    if(o.type==="Chosen Champion") o.type="Champion Unit";
    if(o.rarity==="Champion")      o.rarity="Showcase";
    if(!o.domains) o.domains = o.domain&&o.domain!=="None"?[o.domain]:[];
    if(!o.cardNum) o.cardNum="";
    return o;
  });
}

// ── Views ─────────────────────────────────────────────────────
function setView(v){
  currentView=v;
  document.getElementById("view-list").style.display  = v==="list" ?"":"none";
  document.getElementById("view-stats").style.display = v==="stats"?"":"none";
  document.getElementById("tab-list").className  = "tab-btn"+(v==="list" ?" active":"");
  document.getElementById("tab-stats").className = "tab-btn"+(v==="stats"?" active":"");
  if(v==="stats") renderStats();
}

// ── Domain checkboxes ─────────────────────────────────────────
function buildDomainChecks(selected=[]){
  document.getElementById("m-domain-checks").innerHTML = DOMAINS.map(d=>`
    <label class="domain-chk${selected.includes(d)?" checked":""}" style="color:${DC[d]};${selected.includes(d)?`border-color:${DC[d]}`:""}" >
      <input type="checkbox" value="${d}" ${selected.includes(d)?"checked":""} onchange="onDomainChange()">
      <span class="dot" style="background:${DC[d]}"></span>${d}
    </label>`).join("");
  updateDomainHint();
}
function onDomainChange(){
  const checked=getCheckedDomains();
  if(checked.length>2){
    document.querySelectorAll("#m-domain-checks input[type=checkbox]").forEach(cb=>{
      if(!checked.slice(0,2).includes(cb.value))cb.checked=false;
    });
  }
  document.querySelectorAll("#m-domain-checks .domain-chk").forEach(lbl=>{
    const cb=lbl.querySelector("input"),on=cb.checked;
    lbl.classList.toggle("checked",on);
    lbl.style.borderColor=on?DC[cb.value]:"";
  });
  updateDomainHint();
}
function updateDomainHint(){
  const n=getCheckedDomains().length;
  document.getElementById("m-domain-hint").textContent=n===0?"No domain":n===1?"Single domain":"Dual domain";
}
function getCheckedDomains(){
  return[...document.querySelectorAll("#m-domain-checks input[type=checkbox]:checked")].map(cb=>cb.value);
}

// ── Pool-only autocomplete (instant, no API) ──────────────────
function acPoolInput(){
  acIndex=-1;
  const val=document.getElementById("m-name").value.trim();
  const dd=document.getElementById("ac-dropdown");
  if(val.length<2){dd.style.display="none";return;}
  acPoolItems=cards.filter(c=>
    c.name.toLowerCase().includes(val.toLowerCase())||
    (c.cardNum||"").toLowerCase().includes(val.toLowerCase())
  );
  if(!acPoolItems.length){dd.style.display="none";return;}
  dd.innerHTML=acPoolItems.map((c,i)=>`
    <div class="ac-item" data-i="${i}" onmousedown="acPickPool(${i})">
      <div class="ac-main">
        <div class="ac-name">${esc(c.name)}</div>
        <div class="ac-meta">${[c.set,c.type,c.rarity].filter(Boolean).join(" · ")}</div>
      </div>
      ${c.cardNum?`<span class="ac-num">${esc(c.cardNum)}</span>`:""}
      <span class="ac-tag ac-tag-pool">in pool</span>
    </div>`).join("");
  dd.style.display="block";
}
function acPickPool(idx){
  const c=acPoolItems[idx]; if(!c)return;
  document.getElementById("m-name").value=c.name;
  document.getElementById("ac-dropdown").style.display="none";
  setSel("m-set",c.set); setSel("m-rarity",c.rarity); setSel("m-type",c.type||"Other");
  document.getElementById("m-cardnum").value=c.cardNum||"";
  buildDomainChecks(c.domains||[]);
  showBanner("✅ Matched from your pool","ok");
}
function acKey(e){
  const dd=document.getElementById("ac-dropdown");
  const items=dd.querySelectorAll(".ac-item");
  if(!items.length)return;
  if(e.key==="ArrowDown"){e.preventDefault();acIndex=Math.min(acIndex+1,items.length-1);}
  else if(e.key==="ArrowUp"){e.preventDefault();acIndex=Math.max(acIndex-1,-1);}
  else if(e.key==="Enter"&&acIndex>=0){e.preventDefault();acPickPool(acIndex);return;}
  else if(e.key==="Escape"){dd.style.display="none";acIndex=-1;return;}
  items.forEach((el,i)=>el.classList.toggle("ac-active",i===acIndex));
}
document.addEventListener("click",e=>{
  if(!e.target.closest(".ac-wrap"))document.getElementById("ac-dropdown").style.display="none";
});

// ── Database Lookup (riftcodex via CORS proxies) ──────────────
const API_BASE = "https://api.riftcodex.com";
// Try proxies in order until one works
const PROXIES = [
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://thingproxy.freeboard.io/fetch/${u}`,
];

async function fetchWithProxy(apiUrl) {
  // First try direct (in case API adds CORS later)
  try {
    const r = await fetch(apiUrl, {signal: AbortSignal.timeout(4000)});
    if(r.ok) return r.json();
  } catch(e) {}
  // Try each proxy
  for(const proxy of PROXIES) {
    try {
      const r = await fetch(proxy(apiUrl), {signal: AbortSignal.timeout(6000)});
      if(r.ok) {
        const text = await r.text();
        return JSON.parse(text);
      }
    } catch(e) {}
  }
  throw new Error("All proxies failed");
}

async function lookupCard(){
  const name=document.getElementById("m-name").value.trim();
  if(!name){showBanner("⚠️ Enter a card name first","err");return;}
  const btn=document.getElementById("btn-lookup");
  btn.disabled=true; btn.textContent="⏳ Looking up...";
  try{
    const apiUrl=`${API_BASE}/cards/name?fuzzy=${encodeURIComponent(name)}&size=15&sort=name`;
    const data = await fetchWithProxy(apiUrl);
    // riftcodex wraps in {data:[...]} or returns array directly
    const list=Array.isArray(data)?data:(data.data||[]);
    if(!list.length){showBanner(`❌ "${name}" not found in database — fill manually`,"err");return;}

    // Pick best match: prefer exact name match, else first result
    const exact=list.find(c=>c.name.toLowerCase()===name.toLowerCase());
    const pick=exact||list[0];
    const mapped=parseApiCard(pick);

    // Fill all fields
    document.getElementById("m-name").value=mapped.name;
    setSel("m-set",   mapped.set);
    setSel("m-rarity",mapped.rarity);
    setSel("m-type",  mapped.type);
    document.getElementById("m-cardnum").value=mapped.cardNum;
    buildDomainChecks(mapped.domains);

    // If multiple results, show them in dropdown so user can pick different variant
    if(list.length>1){
      const dd=document.getElementById("ac-dropdown");
      acPoolItems=list.map(parseApiCard);
      dd.innerHTML=list.map((c,i)=>{
        const m=parseApiCard(c);
        return`<div class="ac-item" data-i="${i}" onmousedown="acPickDb(${i})">
          <div class="ac-main">
            <div class="ac-name">${esc(m.name)}</div>
            <div class="ac-meta">${[m.set,m.type,m.rarity].filter(Boolean).join(" · ")}</div>
          </div>
          ${m.cardNum?`<span class="ac-num">${esc(m.cardNum)}</span>`:""}
          <span class="ac-tag ac-tag-db">db</span>
        </div>`;
      }).join("");
      dd.style.display="block";
      showBanner(`✅ Auto-filled "${mapped.name}" — ${list.length} variants found, pick below`,"ok");
    } else {
      showBanner(`✅ Auto-filled from database: ${mapped.name}`,"ok");
    }
  }catch(err){
    showBanner(`❌ Lookup failed (${err.message}) — fill manually`,"err");
  }finally{
    btn.disabled=false; btn.textContent="🔍 Lookup";
  }
}

function acPickDb(idx){
  const item=acPoolItems[idx]; if(!item)return;
  document.getElementById("m-name").value=item.name;
  setSel("m-set",   item.set);
  setSel("m-rarity",item.rarity);
  setSel("m-type",  item.type);
  document.getElementById("m-cardnum").value=item.cardNum||"";
  buildDomainChecks(item.domains||[]);
  document.getElementById("ac-dropdown").style.display="none";
  showBanner(`✅ Selected: ${item.name}`,"ok");
}

function showBanner(msg,type){
  const b=document.getElementById("autofill-banner");
  b.textContent=msg;
  b.className="autofill-banner "+(type==="ok"?"autofill-ok":"autofill-err");
  b.style.display="flex";
  if(type==="ok") setTimeout(()=>b.style.display="none",4000);
}

function setSel(id,val){
  const sel=document.getElementById(id);
  const opt=[...sel.options].find(o=>o.value===val||o.text===val);
  if(opt) sel.value=opt.value;
}

// ── Filters / Sort ────────────────────────────────────────────
function getFiltered(){
  const search  = document.getElementById("f-search").value.toLowerCase();
  const fSet    = document.getElementById("f-set").value;
  const fRarity = document.getElementById("f-rarity").value;
  const fDomain = document.getElementById("f-domain").value;
  const fType   = document.getElementById("f-type").value;
  const fStatus = document.getElementById("f-status").value;
  const sortBy  = document.getElementById("f-sort").value;
  return cards.filter(c=>{
    if(search&&!c.name.toLowerCase().includes(search)&&!(c.cardNum||"").toLowerCase().includes(search))return false;
    if(fSet!=="All"    &&c.set!==fSet)    return false;
    if(fRarity!=="All" &&c.rarity!==fRarity)return false;
    if(fDomain!=="All" &&!(c.domains||[]).includes(fDomain))return false;
    if(fType!=="All"   &&c.type!==fType)  return false;
    if(fStatus==="In Deck"&&c.inDeck===0) return false;
    if(fStatus==="In Pool"&&c.inPool===0) return false;
    if(fStatus==="Mixed"  &&(c.inDeck===0||c.inPool===0))return false;
    return true;
  }).sort((a,b)=>{
    if(sortBy==="name")   return a.name.localeCompare(b.name);
    if(sortBy==="rarity") return RARITIES.indexOf(a.rarity)-RARITIES.indexOf(b.rarity);
    if(sortBy==="type")   return TYPES.indexOf(a.type||"Other")-TYPES.indexOf(b.type||"Other");
    if(sortBy==="set")    return a.set.localeCompare(b.set);
    if(sortBy==="num")    return(a.cardNum||"").localeCompare(b.cardNum||"");
    if(sortBy==="copies") return b.totalCopies-a.totalCopies;
    return 0;
  });
}

// ── Render ────────────────────────────────────────────────────
function render(){
  const total=cards.reduce((s,c)=>s+c.totalCopies,0);
  const inDeck=cards.reduce((s,c)=>s+c.inDeck,0);
  const inPool=cards.reduce((s,c)=>s+c.inPool,0);
  document.getElementById("s-total").textContent=total;
  document.getElementById("s-unique").textContent=cards.length;
  document.getElementById("s-deck").textContent=inDeck;
  document.getElementById("s-pool").textContent=inPool;
  const filtered=getFiltered();
  document.getElementById("count-txt").textContent=`${filtered.length} card${filtered.length!==1?"s":""} shown`;
  if(!filtered.length){
    document.getElementById("card-list").innerHTML=`<div class="empty"><div class="icon">🃏</div><div class="t1">No cards yet</div><div>Hit "+ Add Card", type a name, then click 🔍 Lookup</div></div>`;
    return;
  }
  document.getElementById("card-list").innerHTML=filtered.map(card=>{
    const rc=RC[card.rarity]||"#888", ri=RI[card.rarity]||"●";
    const doms=card.domains||[];
    const domBadges=doms.map(d=>`<span class="badge" style="background:${DC[d]||"#888"}18;color:${DC[d]||"#888"};border-color:${DC[d]||"#888"}44">${d}</span>`).join("");
    const pct=card.totalCopies>0?(card.inDeck/card.totalCopies)*100:0;
    const chip=card.inDeck===0?`<span class="chip chip-pool">IN POOL</span>`:card.inPool===0?`<span class="chip chip-deck">IN DECK</span>`:`<span class="chip chip-split">SPLIT</span>`;
    const typeBadge=card.type&&card.type!=="Other"?`<span class="badge" style="background:#ffffff08;color:var(--text2);border-color:#ffffff18">${card.type}</span>`:"";
    const setColor=card.set==="Spiritforged"?"#a78bfa":card.set==="Proving Grounds"?"#34d399":"#60a5fa";
    return`<div class="card-row">
      <div class="rarity-icon" style="color:${rc}" title="${card.rarity}">${ri}</div>
      <div class="card-info">
        <div class="card-name">${esc(card.name)}${card.cardNum?`<span class="card-num-tag">${esc(card.cardNum)}</span>`:""}</div>
        <div class="badges">
          <span class="badge" style="background:${setColor}18;color:${setColor};border-color:${setColor}44">${card.set}</span>
          <span class="badge" style="background:${rc}18;color:${rc};border-color:${rc}44">${ri} ${card.rarity}</span>
          ${domBadges}${typeBadge}
          ${card.notes?`<span class="note-txt">${esc(card.notes)}</span>`:""}
        </div>
      </div>
      <div class="prog-wrap">
        <div class="prog-counts"><span style="color:var(--yellow)">🎴 ${card.inDeck}</span><span style="color:var(--green)">🗂 ${card.inPool}</span></div>
        <div class="prog-bg"><div class="prog-fill" style="width:${pct}%;background:${rc}"></div></div>
        <div class="prog-total">×${card.totalCopies} total</div>
      </div>
      <div class="ctrl-wrap">
        <button class="ctrl-btn" onclick="move('${card.id}',-1)" ${card.inDeck===0?"disabled":""}>−</button>
        <div class="ctrl-val">${card.inDeck}/${card.totalCopies}</div>
        <button class="ctrl-btn" onclick="move('${card.id}',1)" ${card.inDeck===card.totalCopies?"disabled":""}>+</button>
      </div>
      ${chip}
      <div class="act-wrap">
        <button class="act-btn" onclick="startEdit('${card.id}')">✏️</button>
        <button class="act-btn" onclick="del('${card.id}','${esc(card.name).replace(/'/g,"\\'")}')">🗑</button>
      </div>
    </div>`;
  }).join("");
}

// ── Stats ─────────────────────────────────────────────────────
function renderStats(){
  const total=cards.reduce((s,c)=>s+c.totalCopies,0);
  const inDeck=cards.reduce((s,c)=>s+c.inDeck,0);
  const inPool=cards.reduce((s,c)=>s+c.inPool,0);
  const byRar =RARITIES.map(r=>({label:r,count:cards.filter(c=>c.rarity===r).reduce((s,c)=>s+c.totalCopies,0)}));
  const bySet =["Origins","Spiritforged","Proving Grounds","Other"].map(s=>({label:s,count:cards.filter(c=>c.set===s).reduce((s2,c)=>s2+c.totalCopies,0)}));
  const byDom =DOMAINS.map(d=>({label:d,count:cards.filter(c=>(c.domains||[]).includes(d)).reduce((s,c)=>s+c.totalCopies,0)})).filter(d=>d.count>0);
  const byType=TYPES.map(t=>({label:t,count:cards.filter(c=>(c.type||"Other")===t).reduce((s,c)=>s+c.totalCopies,0)})).filter(t=>t.count>0);
  const maxR=Math.max(...byRar.map(r=>r.count),1);
  const maxD=Math.max(...byDom.map(d=>d.count),1);
  const maxT=Math.max(...byType.map(t=>t.count),1);
  const pct=total>0?Math.round((inDeck/total)*100):0;
  document.getElementById("view-stats").innerHTML=`<div class="stats-grid">
    <div class="sc">
      <div class="sc-title">Pool Overview</div>
      <div class="sc-row"><span>Total copies</span><strong>${total}</strong></div>
      <div class="sc-row"><span>Unique cards</span><strong>${cards.length}</strong></div>
      <div class="sc-row"><span>In deck</span><strong style="color:var(--yellow)">${inDeck}</strong></div>
      <div class="sc-row"><span>In pool</span><strong style="color:var(--green)">${inPool}</strong></div>
      <div style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:3px"><span>← Pool</span><span>${pct}% in deck</span><span>Deck →</span></div>
        <div class="prog-bg" style="height:9px"><div class="prog-fill" style="width:${pct}%;background:var(--yellow)"></div></div>
      </div>
    </div>
    <div class="sc"><div class="sc-title">By Set</div>
      ${bySet.map(({label,count})=>`<div class="sc-bar"><div class="sc-bar-lbl"><span>${label}</span><span style="color:var(--text2)">${count}</span></div><div class="sc-bar-bg"><div class="sc-bar-fill" style="width:${total>0?Math.round((count/total)*100):0}%;background:var(--blue)"></div></div></div>`).join("")}
    </div>
    <div class="sc"><div class="sc-title">By Rarity</div>
      ${byRar.map(({label,count})=>`<div class="sc-bar"><div class="sc-bar-lbl"><span style="color:${RC[label]}">${RI[label]} ${label}</span><span style="color:var(--text2)">${count}</span></div><div class="sc-bar-bg"><div class="sc-bar-fill" style="width:${Math.round((count/maxR)*100)}%;background:${RC[label]}"></div></div></div>`).join("")}
    </div>
    <div class="sc"><div class="sc-title">By Domain</div>
      ${byDom.length?byDom.map(({label,count})=>`<div class="sc-bar"><div class="sc-bar-lbl"><span style="color:${DC[label]}">${label}</span><span style="color:var(--text2)">${count}</span></div><div class="sc-bar-bg"><div class="sc-bar-fill" style="width:${Math.round((count/maxD)*100)}%;background:${DC[label]}"></div></div></div>`).join(""):`<div style="color:var(--text3);font-size:12px;padding:4px 0">No domain data yet</div>`}
    </div>
    <div class="sc"><div class="sc-title">By Card Type</div>
      ${byType.length?byType.map(({label,count})=>`<div class="sc-bar"><div class="sc-bar-lbl"><span>${label}</span><span style="color:var(--text2)">${count}</span></div><div class="sc-bar-bg"><div class="sc-bar-fill" style="width:${Math.round((count/maxT)*100)}%;background:var(--purple)"></div></div></div>`).join(""):`<div style="color:var(--text3);font-size:12px;padding:4px 0">No type data yet</div>`}
    </div>
  </div>`;
}

// ── Modal helpers ─────────────────────────────────────────────
function syncPool(){
  const tc=Math.max(1,parseInt(document.getElementById("m-total").value)||1);
  const id=Math.min(Math.max(0,parseInt(document.getElementById("m-deck").value)||0),tc);
  document.getElementById("m-pool").value=tc-id;
}
function resetForm(){
  ["m-name","m-cardnum","m-notes"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("m-set").value="Origins";
  document.getElementById("m-rarity").value="Common";
  document.getElementById("m-type").value="Unit";
  document.getElementById("m-total").value=1;
  document.getElementById("m-deck").value=0;
  document.getElementById("m-pool").value=1;
  document.getElementById("autofill-banner").style.display="none";
  document.getElementById("ac-dropdown").style.display="none";
  buildDomainChecks([]);
  acPoolItems=[];acIndex=-1;
}
function openAdd(){
  editId=null;resetForm();
  document.getElementById("modal-title").textContent="Add Card";
  document.querySelector("#modal-form .btn-save").textContent="Add to Pool";
  document.getElementById("modal-form").style.display="flex";
  document.getElementById("m-name").focus();
}
function startEdit(id){
  const card=cards.find(c=>c.id===id);if(!card)return;
  editId=id;resetForm();
  document.getElementById("modal-title").textContent="Edit Card";
  document.querySelector("#modal-form .btn-save").textContent="Save Changes";
  document.getElementById("m-name").value=card.name;
  document.getElementById("m-cardnum").value=card.cardNum||"";
  setSel("m-set",card.set); setSel("m-rarity",card.rarity); setSel("m-type",card.type||"Other");
  document.getElementById("m-total").value=card.totalCopies;
  document.getElementById("m-deck").value=card.inDeck;
  document.getElementById("m-pool").value=card.inPool;
  document.getElementById("m-notes").value=card.notes||"";
  buildDomainChecks(card.domains||[]);
  document.getElementById("modal-form").style.display="flex";
  document.getElementById("m-name").focus();
}
function saveCard(){
  const name=document.getElementById("m-name").value.trim();if(!name)return;
  const tc=Math.max(1,parseInt(document.getElementById("m-total").value)||1);
  const id=Math.min(Math.max(0,parseInt(document.getElementById("m-deck").value)||0),tc);
  const entry={
    id:editId||String(Date.now()),name,
    cardNum:document.getElementById("m-cardnum").value.trim().toUpperCase()||"",
    set:document.getElementById("m-set").value,
    rarity:document.getElementById("m-rarity").value,
    domains:getCheckedDomains(),
    type:document.getElementById("m-type").value,
    totalCopies:tc,inDeck:id,inPool:tc-id,
    notes:document.getElementById("m-notes").value.trim()
  };
  if(editId)cards=cards.map(c=>c.id===editId?entry:c);
  else cards=[...cards,entry];
  save();render();closeModal("modal-form");
}
function move(id,delta){
  cards=cards.map(c=>{
    if(c.id!==id)return c;
    const nd=Math.min(Math.max(c.inDeck+delta,0),c.totalCopies);
    return{...c,inDeck:nd,inPool:c.totalCopies-nd};
  });
  save();render();
}
function del(id,name){
  if(!confirm(`Remove "${name}" from pool?`))return;
  cards=cards.filter(c=>c.id!==id);save();render();
}
function openImport(){
  document.getElementById("imp-txt").value="";
  document.getElementById("modal-import").style.display="flex";
  document.getElementById("imp-txt").focus();
}
function doImport(){
  const lines=document.getElementById("imp-txt").value.trim().split("\n");
  const imp=lines.flatMap(line=>{
    const p=line.split("\t");
    const qty=parseInt(p[0]);
    const tc=isNaN(qty)?1:qty;
    const name=(isNaN(qty)?p[0]:p[1]||"").trim();
    if(!name)return[];
    return[{id:String(Date.now()+Math.random()),name,cardNum:"",set:"Origins",rarity:"Common",domains:[],type:"Other",totalCopies:tc,inDeck:0,inPool:tc,notes:""}];
  });
  cards=[...cards,...imp];save();render();closeModal("modal-import");
}
function closeModal(id){document.getElementById(id).style.display="none";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal("modal-form");closeModal("modal-import");}});
load();
</script>
